<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Dashboard – Week 8-10 Lab</title>


  <!-- Vue.js 3 via CDN (no installation required) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>


  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #F3F4F6; color: #374151; }
    header { background: #0A2342; color: white; padding: 20px 40px; }
    header h1 { font-size: 1.6rem; }
    header p  { font-size: 0.9rem; color: #93C5FD; margin-top: 4px; }
    .toolbar { background: white; padding: 16px 40px; border-bottom: 2px solid #E5E7EB; }
    .toolbar input { padding: 8px 14px; border: 1px solid #D1D5DB; border-radius: 6px; width: 260px; }
    .main { padding: 30px 40px; }
    .stats { display: flex; gap: 20px; margin-bottom: 28px; }
    .stat-card { background: white; border-radius: 8px; padding: 16px 24px; flex: 1;
                 box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .stat-card h2 { font-size: 2rem; color: #028090; }
    .stat-card p  { font-size: 0.85rem; color: #6B7280; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; padding: 20px;
            box-shadow: 0 1px 3px rgba(0,0,0,.1); border-top: 3px solid #028090; }
    .card h3 { font-size: 0.95rem; color: #0A2342; margin-bottom: 8px; }
    .card p  { font-size: 0.87rem; color: #6B7280; line-height: 1.5; }
    .tag { display: inline-block; background: #EFF6FF; color: #1E40AF;
           border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; margin-top: 10px; }
    .loading { text-align: center; padding: 60px; color: #6B7280; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div id="app">
    <!-- PART 1: App header -->
    <header>
      <h1>Blog Dashboard</h1>
      <p>Web Systems Lab – Weeks 8 to 10</p>
    </header>


    <!-- PART 2: Toolbar and stats (you will fill this in Part 2) -->
    

    <!-- PART 3: Post grid (you will fill this in Part 3) -->
        <!-- Stats bar -->
    <div class="toolbar">

  <strong>
    Showing: {{ filteredPosts.length }} / {{ posts.length }} posts
  </strong>

  &nbsp;&nbsp;&nbsp;

  <!-- Search -->
  <input
    v-model="search"
    type="text"
    placeholder="🔍 Search posts..."
  />

  <!-- Author Filter -->
  <select
    v-model.number="selectedUser"
    style="margin-left:16px; padding:7px 12px;"
  >
    <option :value="0">All Authors</option>

    <option
      v-for="user in users"
      :key="user.id"
      :value="user.id"
    >
      {{ user.name }}
    </option>

  </select>

</div>


    <!-- Loading indicator (shown while fetching) -->
    <div class="main">
      <p v-if="loading" class="loading">Loading posts from REST API...</p>


      <!-- Post grid (shown when loaded) -->
      <div v-else class="grid">
        <div v-for="post in filteredPosts" :key="post.id" class="card">
          <span class="tag">Post #{{ post.id }}</span>
          <h3>{{ post.title }}</h3>
          <p>{{ post.body }}</p>
          <p style="margin-top:10px; font-size:.8rem; color:#028090;">
            By: {{ getAuthor(post.userId) }}
          </p>
        </div>
      </div>
    </div>



  <script>
    const { createApp, ref, computed, onMounted } = Vue;


    createApp({
        setup() {

  const posts = ref([]);
  const users = ref([]);
  const loading = ref(true);

  const search = ref('');

  // NEW: selected user filter
  const selectedUser = ref(0);

  const getAuthor = (userId) => {
    const user = users.value.find(u => u.id === userId);
    return user ? user.name : 'Unknown Author';
  };

  onMounted(async () => {
    try {
      const postsRes = await fetch('https://jsonplaceholder.typicode.com/posts');
      const usersRes = await fetch('https://jsonplaceholder.typicode.com/users');

      posts.value = await postsRes.json();
      users.value = await usersRes.json();

    } catch (error) {
      console.error('Error fetching data:', error);

    } finally {
      loading.value = false;
    }
  });

  // UPDATED computed filter
  const filteredPosts = computed(() => {

    let result = posts.value;

    // Filter by selected author
    if (selectedUser.value !== 0) {
      result = result.filter(
        p => p.userId === selectedUser.value
      );
    }

    // Filter by search text
    if (search.value.trim()) {

      const q = search.value.toLowerCase();

      result = result.filter(post =>
        post.title.toLowerCase().includes(q) ||
        post.body.toLowerCase().includes(q)
      );
    }

    return result;
  });

  return {
    posts,
    users,
    loading,
    search,
    selectedUser,
    getAuthor,
    filteredPosts
  };
}
    }).mount('#app');
  </script>
</body>
</html>
